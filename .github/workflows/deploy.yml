name: Build and Deploy Tripinator

on:
  push:
    branches:
      - main
  # PRs only run the `check` job — build/deploy are gated to pushes on main.
  pull_request:
    branches:
      - main
  # Manual run from the Actions tab (e.g. after a startup failure, which
  # can't be re-run). Builds and deploys only when started on main.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase safely
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/tripinator

jobs:
  # Quality gate: nothing is built or deployed unless this passes.
  check:
    runs-on: ubuntu-latest
    # Same Node base as the Dockerfile.
    container: node:24-bookworm-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # On main the Docker build below compiles the app anyway; on PRs this is
      # the only place a broken build would show up.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          BETTER_AUTH_URL: https://localhost:3000

  build-and-push:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for faster caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1. Build and push the main application runtime image (runner target)
      - name: Build and push App Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

      # 2. Build and push the tools image (builder target for admin tasks)
      - name: Build and push Tools Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE_BASE }}-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

  # The deploy itself runs in the private connor935/server repo (SSH key,
  # host and paths live only there). This job starts it and waits for the
  # result, so a failed deploy still fails this run — without logging details.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Holds DEPLOY_DISPATCH_TOKEN (fine-grained, Actions: write on the server
    # repo only); restricted to main in Settings → Environments.
    environment: production
    permissions: {}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      DEPLOY_REPO: ${{ github.repository_owner }}/server
    steps:
      - name: Trigger deploy
        run: |
          out=$(gh workflow run deploy.yml -R "$DEPLOY_REPO" --ref main \
            -f app=tripinator -f ref="$GITHUB_SHA" 2>&1)
          run_id=$(printf '%s' "$out" | grep -oE 'actions/runs/[0-9]+' | head -1 | cut -d/ -f3 || true)
          if [ -z "$run_id" ]; then
            # Older gh versions don't print the run URL — find the run instead.
            sleep 5
            run_id=$(gh run list -R "$DEPLOY_REPO" -w deploy.yml -e workflow_dispatch \
              -L 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run_id=$run_id" >> "$GITHUB_ENV"

      - name: Wait for deploy
        # Output dropped: only the exit status matters here.
        run: gh run watch "$run_id" -R "$DEPLOY_REPO" --exit-status --interval 10 > /dev/null
