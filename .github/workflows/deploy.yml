name: Build and Deploy Tripinator

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase safely
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/tripinator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for faster caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and push the main application runtime image (runner target)
      - name: Build and push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

      # 2. Build and push the tools image (builder target for admin tasks)
      - name: Build and push Tools Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE_BASE }}-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Stop the deploy on the first failing command — in particular, if the
          # migration step below fails we must NOT roll out the app.
          script_stop: true
          script: |
            # Navigate to where your docker-compose.yml lives on Hetzner
            cd $STACK_DIR

            # Authenticate Docker with GHCR using the token if not already cached
            # (Ensure you ran `docker login ghcr.io` once on the server manually)

            # Pull the newly pushed app image, and the tools image separately
            # (the `admin` service is under the `tools` profile, so a bare
            # `docker compose pull` skips it — name it explicitly).
            docker compose pull
            docker compose pull admin

            # Apply DB migrations BEFORE starting the new app, via the one-off
            # tools image (same Postgres + credentials as the app). Running it
            # as a gated step means a bad migration fails the deploy here instead
            # of crash-looping the app container. The app also auto-migrates on
            # startup, so this is idempotent — a re-run just records nothing new.
            # Overrides the `admin` service's create-admin entrypoint with the
            # migration runner (plain node ESM, no tsx needed).
            docker compose run --rm --entrypoint node admin scripts/migrate.mjs

            # Relaunch the application with zero downtime
            docker compose up -d --remove-orphans

            # Clean up old images to keep your Hetzner disk clear
            docker image prune -f
